<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input_type</title>
</head>

<body>
    <h2>Input Types Example</h2>
    <form action="">
        <label>Enter Your Name : </label>
        <input type="text" placeholder="Enter your name">
        <label>Enter Your mail : </label>
        <input type="mail" placeholder="mail">
        <br><br>
        <label>Enter Your phone number : </label>
        <input type="number" placeholder="Enter your phone number">
        <label>Enter Your password : </label>
        <input type="password" placeholder="Enter your password">
        <label>Enter DOB</label>
        <input type="date">
        <label>Enter month</label>
        <input type="month">
        <label for="">week</label>
        <input type="week" name="" id="">
        <label for=""> enter time</label>
        <input type="time">
        <label for="">enter date and time</label>
        <input type="datetime-local">
        <label for=""> choose cities</label>
        <input type="checkbox" checked />Mumbai
        <input type="checkbox">delhi
        <input type="checkbox" checked />chennai
        <input type="checkbox">bangaluru
        <br><br>
        <label for="">select gender </label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> FeMale
        <input type="radio" name="gender"> other
        <label for="">Select color</label>
        <input type="color" />
        <label for="">Select range</label>
        <input type="range" />
        <label for="">upload docs</label>
        <input type="file">
        <label for="">upload docs</label>
        <input type="file" multiple>
        <label for="">Search</label>
        <input type="search" placeholder="type here to search....">
        <label for="">Enter url</label>
        <input type="url" placeholder="https://example.com">
        <br><br>
        <label for="">enter telephone number</label>
        <input type="tel" placeholder="7094729574">
        <br><br>
        <label for="">select city</label>
        <select name="" id="">
            <option value="">choose ur city</option>
            <option value="">Mumbai</option>
            <option value="">Nashik</option>
            <option value="">agra</option>
            <option value="">delhi</option>
            <option value="">bengluru</option>
        </select>
        <label for="">enter address</label>
       <textarea rows="5" cols="20"></textarea>
       <input type="submit" value="submit form">
       <input type="button" value="submit form">
       <input type="reset" value="reset form">


    </form>

</body>

</html>
